name: Attach HACS Release Asset

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.2)'
        required: true
        default: 'v2.2.2'

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify release tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          if [[ "$tag" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(b[0-9]+)?$ ]]; then
            base="${BASH_REMATCH[1]}"
          else
            echo "::error::Unexpected release tag '$RELEASE_TAG' (expected vX.Y.Z or vX.Y.ZbN)."
            exit 1
          fi
          version="$(python3 -c 'import json; print(json.load(open("custom_components/haghs/manifest.json"))["version"])')"
          if [ "$base" != "$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match manifest version '$version'."
            exit 1
          fi
          echo "Release tag '$RELEASE_TAG' matches manifest version '$version'."

      - name: Create haghs.zip
        run: cd custom_components && zip -r ../haghs.zip haghs/

      - name: Upload haghs.zip to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: haghs.zip
